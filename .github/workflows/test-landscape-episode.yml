name: Test Landscape Episode

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Series or episode title'
        required: true
        default: 'Alien Is My Girlfriend'
        type: string
      season:
        description: 'Season number'
        required: true
        default: '1'
        type: string
      episode:
        description: 'Episode number'
        required: true
        default: '1'
        type: string
      language:
        description: 'Narration language'
        required: true
        default: 'en'
        type: choice
        options: [en, hi]
      genre:
        description: 'Story genre'
        required: true
        default: 'science fiction romance'
        type: string
      style:
        description: 'Art style — "series" keeps the look this series already has (a new series uses the DEVOTIONAL_STYLE variable, else cartoon3d)'
        required: true
        default: 'series'
        type: choice
        options: [series, cartoon3d, cartoon2d, realistic, illustration]
      publish:
        description: 'Publish the finished episode publicly to YouTube and Facebook'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  render-landscape-episode:
    runs-on: ubuntu-latest
    # A 15-minute 1080p episode takes roughly 30-40 minutes end to end on a
    # standard 4-core runner (most of it rendering).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts uv
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-lohit-deva fonts-dejavu-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install pipeline dependencies
        working-directory: scripts
        run: npm install
      - name: Generate (and optionally publish) 15-minute landscape episode
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNTS: ${{ secrets.CLOUDFLARE_ACCOUNTS }}
          # Backup narration if Microsoft's free voice keeps refusing: Sarvam
          # when a key is set, else Google Cloud TTS with the project's
          # service account (scripts/lib/google-tts.js).
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Free backup voice when Microsoft's edge-tts refuses (scripts/lib/gemini-tts.js).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: post to a Telegram channel (CHANNEL-IDENTITY.md → Telegram).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: ${{ vars.SARVAM_SPEAKER }}
          EPISODE_TITLE: ${{ inputs.title }}
          EPISODE_SEASON: ${{ inputs.season }}
          EPISODE_NUMBER: ${{ inputs.episode }}
          EPISODE_LANGUAGE: ${{ inputs.language }}
          EPISODE_GENRE: ${{ inputs.genre }}
          EPISODE_PUBLISH: ${{ inputs.publish }}
          EPISODE_STYLE: ${{ inputs.style != 'series' && inputs.style || '' }}
          DEVOTIONAL_STYLE: ${{ vars.DEVOTIONAL_STYLE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node build-landscape-episode.js
      # The finished mp4 never goes into git: a 15-minute 1080p episode is
      # well over GitHub's 100MB file limit (a real run's push failed on it),
      # and YouTube/Facebook keep their own copies. It's kept here instead,
      # downloadable from the run page for a day.
      - name: Keep the rendered video for a day
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: episode-s${{ inputs.season }}e${{ inputs.episode }}
          path: public/episodes/**/*.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Persist generated test output
        if: always()
        run: |
          git config user.name "storybyte-landscape-test"
          git config user.email "bot@storybyte.app"
          # Story text, scene art, thumbnail and the series bible (which the
          # next episode reads for its characters) — everything but the mp4,
          # which .gitignore keeps out.
          # A failed run leaves empty files (e.g. a 0-byte audio.mp3) — never commit those.
          find public/episodes -type f -size 0 -delete 2>/dev/null || true
          git add public/episodes 2>/dev/null || true
          git commit -m "test: render landscape S${{ inputs.season }}E${{ inputs.episode }}" || echo "nothing to commit"
          for delay in 2 4 8 16; do
            git pull --rebase --autostash || true
            git push && exit 0
            sleep "$delay"
          done
          exit 1

      # Puts the new episode in the app's "Long stories" row right away: the
      # site deploy rebuilds long-videos.json from the episodes' story.json.
      # Runs after the push above pulled in main, so it never deploys an
      # older copy of the site.
      - name: Update the website and the app's video stories
        if: success() && inputs.publish
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "No FIREBASE_SERVICE_ACCOUNT; skipping"; exit 0; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools deploy --only hosting --project storybyte-76716 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
          # The new episode as an app story too (likes, comments, Community feed).
          node scripts/sync-video-stories.js
