name: Test Landscape Episode

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Series or episode title'
        required: true
        default: 'Alien Is My Girlfriend'
        type: string
      episode:
        description: 'Episode number'
        required: true
        default: '1'
        type: string
      language:
        description: 'Narration language'
        required: true
        default: 'en'
        type: choice
        options: [en, hi]
      genre:
        description: 'Story genre'
        required: true
        default: 'science fiction romance'
        type: string

permissions:
  contents: write

jobs:
  render-landscape-episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts uv
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-lohit-deva
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install pipeline dependencies
        working-directory: scripts
        run: npm install
      - name: Generate 15-minute landscape episode
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          POLLINATIONS_API_TOKEN: ${{ secrets.POLLINATIONS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EPISODE_TITLE: ${{ inputs.title }}
          EPISODE_NUMBER: ${{ inputs.episode }}
          EPISODE_LANGUAGE: ${{ inputs.language }}
          EPISODE_GENRE: ${{ inputs.genre }}
        run: node build-landscape-episode.js
      - name: Persist generated test output
        if: always()
        run: |
          git config user.name "storybyte-landscape-test"
          git config user.email "bot@storybyte.app"
          git add public/episodes 2>/dev/null || true
          git commit -m "test: render landscape episode ${{ inputs.episode }}" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
