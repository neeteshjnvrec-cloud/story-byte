name: Daily Stories

on:
  schedule:
    - cron: '30 0 * * *'   # 08:50 UTC = 2:20 PM IST (TEST schedule; revert to '30 0 * * *' for 6 AM IST)
  workflow_dispatch:

concurrency:
  group: daily-stories
  cancel-in-progress: false

permissions:
  contents: write           # to commit the generated public/ audio + covers

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts + ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipeline deps
        working-directory: scripts
        run: npm install

      - name: Generate + host stories
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: storybyte-76716
        run: node build-stories.js

      - name: Persist generated audio + covers
        run: |
          git config user.name "storybyte-bot"
          git config user.email "bot@storybyte.app"
          git add public/audio public/covers public/index.html 2>/dev/null || true
          git commit -m "chore: daily story audio + covers ($(date -u +%F))" || echo "nothing to commit"
          git push || echo "nothing to push"
