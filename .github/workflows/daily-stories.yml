name: Daily Stories

on:
  schedule:
    - cron: '30 0 * * *'   # 08:50 UTC = 2:20 PM IST (TEST schedule; revert to '30 0 * * *' for 6 AM IST)
  workflow_dispatch:

concurrency:
  group: daily-stories
  cancel-in-progress: false

permissions:
  contents: write           # to commit the generated public/ audio + covers

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts + ffmpeg + uv
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts uv
          # fonts-lohit-deva: Devanagari (Hindi/Marathi) glyphs for the
          # Instagram carousel renderer — without it, non-Latin story text
          # renders as tofu boxes in the generated slide images.
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-lohit-deva
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install pipeline deps
        working-directory: scripts
        run: npm install

      - name: Generate + host stories
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: storybyte-76716
          # Optional — Instagram carousel auto-post. Left unset until
          # INSTAGRAM-SETUP.md's secrets are added; the pipeline just skips
          # the IG post until then.
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node build-stories.js
          node build-story-pages.js

      # always(): assets already written to public/ must reach the repo even if
      # the generate step failed partway. A Hosting deploy serves only what a
      # fresh checkout contains, so an uncommitted mp3 becomes a 404 later.
      - name: Persist generated audio + covers
        if: always()
        run: |
          git config user.name "storybyte-bot"
          git config user.email "bot@storybyte.app"
          git add public/audio public/covers public/instagram public/s public/index.html 2>/dev/null || true
          git commit -m "chore: daily story audio + covers ($(date -u +%F))" || echo "nothing to commit"
          # The community workflow pushes to main too; rebase so a stale branch
          # doesn't reject the push. A real push failure must stay loud — it
          # means generated audio never landed.
          git pull --rebase --autostash || true
          git push
