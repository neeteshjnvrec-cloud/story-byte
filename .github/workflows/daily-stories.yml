name: Daily Stories

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC (~06:00 IST) daily
  workflow_dispatch:        # manual "Run workflow" button / backfills

concurrency:
  group: daily-stories
  cancel-in-progress: false

permissions:
  contents: write           # needed to create/upload the audio Release

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts + ffmpeg
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipeline deps
        working-directory: scripts
        run: npm ci || npm install

      - name: Generate stories
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUDIO_HOST: github
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build-stories.js
