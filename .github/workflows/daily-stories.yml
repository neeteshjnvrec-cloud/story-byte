name: Daily Stories

on:
  schedule:
    # 23:47 UTC = 5:17 AM IST. Deliberately NOT :00 or :30 — this repo's own
    # run history shows delays growing to 5+ hours at those two (the most
    # oversubscribed minutes on GitHub's shared scheduler, since most crons
    # default to a round number); an off-peak minute gets queued far less.
    - cron: '47 23 * * *'
    # 07:23 UTC = 12:53 PM IST: the festival-eve run. When tomorrow is a
    # festival (scripts/occasions.js), it posts that festival's best-known
    # katha this afternoon, a day ahead of the searches; GitHub's queueing
    # delay still lands it by early evening. Any other day it stops after
    # the first step.
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      festival_eve:
        description: "Festival-eve run: post tomorrow's festival katha now (does nothing if tomorrow isn't a festival)"
        type: boolean
        default: false
      style:
        description: 'Art style for this run (blank = the DEVOTIONAL_STYLE variable, else realistic)'
        required: false
        default: ''
        type: choice
        options: ['', realistic, epic, cartoon3d, cartoon2d, stickman]

concurrency:
  group: daily-stories
  cancel-in-progress: false

permissions:
  contents: write           # to commit the generated public/ audio + covers

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The 12:53 PM IST run (or a manual festival-eve run) only goes on when
      # tomorrow is a festival with an eve katha. Checked before any install,
      # so an ordinary day costs seconds.
      - name: Festival eve?
        id: eve
        run: |
          if [ "${{ github.event.schedule }}" = "23 7 * * *" ] || [ "${{ inputs.festival_eve }}" = "true" ]; then
            echo "mode=eve" >> "$GITHUB_OUTPUT"
            tomorrow=$(TZ=Asia/Kolkata date -d tomorrow +%F)
            if node -e "process.exit(require('./scripts/lib/devotional-calendar').eveKathaOf('$tomorrow') ? 0 : 1)"; then
              echo "Tomorrow ($tomorrow) is a festival: posting its katha this afternoon."
            else
              echo "Tomorrow ($tomorrow) is not a festival: nothing to post."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-python@v5
        if: steps.eve.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install edge-tts + ffmpeg + uv
        if: steps.eve.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts uv
          # fonts-lohit-deva: Devanagari (Hindi/Marathi) glyphs for the
          # Instagram carousel renderer — without it, non-Latin story text
          # renders as tofu boxes in the generated slide images.
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-lohit-deva
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install pipeline deps
        if: steps.eve.outputs.skip != 'true'
        working-directory: scripts
        run: npm install

      - name: Generate + host stories
        if: steps.eve.outputs.skip != 'true'
        working-directory: scripts
        env:
          FESTIVAL_EVE: ${{ steps.eve.outputs.mode == 'eve' && '1' || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Free backup voice when Microsoft's edge-tts refuses (scripts/lib/gemini-tts.js).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: post to a Telegram channel (CHANNEL-IDENTITY.md → Telegram).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          # Google Search Console's HTML-tag code, for the home page (CHANNEL-IDENTITY.md).
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          FIREBASE_PROJECT_ID: storybyte-76716
          # Cloudflare Workers AI draws every picture (CLOUDFLARE-SETUP.md).
          # CLOUDFLARE_ACCOUNTS adds more free accounts, one
          # "accountId:apiToken" per line: when one account's 10,000 daily
          # neurons run out, the next carries on (lib/cloudflare-image.js).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNTS: ${{ secrets.CLOUDFLARE_ACCOUNTS }}
          # Optional — Instagram carousel auto-post. Left unset until
          # INSTAGRAM-SETUP.md's secrets are added; the pipeline just skips
          # the IG post until then.
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Optional — Facebook Page auto-post (same carousel images as
          # Instagram). Left unset until INSTAGRAM-SETUP.md's Facebook
          # section secrets are added; the pipeline just skips the FB post.
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # Optional — YouTube upload of the full narrated video. Left
          # unset until YOUTUBE-SETUP.md's secrets are added; the pipeline
          # just skips the YouTube upload until then. YOUTUBE_REFRESH_TOKEN
          # expires ~weekly while the OAuth app is in Testing mode — see
          # YOUTUBE-SETUP.md for the re-mint step.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Optional — Sarvam AI's natural Hindi narration for the daily
          # devotional story (see scripts/lib/sarvam-tts.js). Unset, the
          # pipeline narrates with edge-tts as before.
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: ${{ vars.SARVAM_SPEAKER }}
          # Art style for every picture: realistic (default), epic, cartoon3d, cartoon2d or stickman —
          # set as a repository variable (Settings → Secrets and variables → Actions → Variables).
          DEVOTIONAL_STYLE: ${{ inputs.style || vars.DEVOTIONAL_STYLE }}
          # Optional: your WhatsApp Channel's invite link, added to every
          # post's description (repository variable).
          WHATSAPP_CHANNEL_URL: ${{ vars.WHATSAPP_CHANNEL_URL }}
        run: |
          node build-stories.js
          node build-story-pages.js
          # Long YouTube videos as app stories, and older Shorts onto their stories.
          node sync-video-stories.js

      # always(): assets already written to public/ must reach the repo even if
      # the generate step failed partway. A Hosting deploy serves only what a
      # fresh checkout contains, so an uncommitted mp3 becomes a 404 later.
      - name: Persist generated audio + covers
        if: always() && steps.eve.outputs.skip != 'true'
        run: |
          git config user.name "storybyte-bot"
          git config user.email "bot@storybyte.app"
          # Only the last day's videos stay in the repo — nothing reads them
          # after posting, and each one otherwise rides along in every deploy.
          node scripts/prune-old-videos.js || true
          git add public/audio public/covers public/s public/index.html public/sitemap.xml public/robots.txt public/long-videos.json public/video.html public/watch.html 2>/dev/null || true
          git commit -m "chore: daily story audio + covers ($(date -u +%F))" || echo "nothing to commit"
          # The community workflow pushes to main too; rebase so a stale branch
          # doesn't reject the push. A real push failure must stay loud — it
          # means generated audio never landed.
          git pull --rebase --autostash || true
          git push
