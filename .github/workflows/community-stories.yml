name: Community Story Audio Generator

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID to generate audio for (optional — if empty, processes all pending)'
        required: false
        default: ''
      style:
        description: 'Art style for this run (blank = the DEVOTIONAL_STYLE variable, else realistic)'
        required: false
        default: ''
        type: choice
        options: ['', realistic, epic, cartoon3d, cartoon2d, stickman]
  # Older app versions trigger this from the app; current ones don't (that
  # needed a GitHub token readable by every client).
  repository_dispatch:
    types: [community-story-published]
  # The hourly sweep is how a new community story gets its audio and is
  # published: it processes every under_review (or failed) story.
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: community-stories
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts + ffmpeg + uv
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts uv
          # fonts-lohit-deva: Devanagari (Hindi/Marathi) glyphs for the
          # Instagram carousel renderer — without it, non-Latin story text
          # renders as tofu boxes in the generated slide images.
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-lohit-deva
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install pipeline deps
        working-directory: scripts
        run: npm install

      - name: Generate audio + covers for community stories
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Free backup voice when Microsoft's edge-tts refuses (scripts/lib/gemini-tts.js).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID: storybyte-76716
          STORIES_FILTER: ${{ github.event.inputs.story_id || '' }}
          # Cloudflare Workers AI draws every picture (CLOUDFLARE-SETUP.md).
          # CLOUDFLARE_ACCOUNTS adds more free accounts, one
          # "accountId:apiToken" per line: when one account's 10,000 daily
          # neurons run out, the next carries on (lib/cloudflare-image.js).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNTS: ${{ secrets.CLOUDFLARE_ACCOUNTS }}
          # Art style for the covers and videos: realistic (default), epic,
          # cartoon3d, cartoon2d or stickman — the run's choice, else the repository variable.
          DEVOTIONAL_STYLE: ${{ inputs.style || vars.DEVOTIONAL_STYLE }}
          # Optional — Instagram carousel auto-post. Left unset until
          # INSTAGRAM-SETUP.md's secrets are added; the pipeline just skips
          # the IG post until then.
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Optional — Facebook Page auto-post (same carousel images as
          # Instagram). Left unset until INSTAGRAM-SETUP.md's Facebook
          # section secrets are added; the pipeline just skips the FB post.
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # Optional — YouTube upload of the full narrated video. Left
          # unset until YOUTUBE-SETUP.md's secrets are added; the pipeline
          # just skips the YouTube upload until then. YOUTUBE_REFRESH_TOKEN
          # expires ~weekly while the OAuth app is in Testing mode — see
          # YOUTUBE-SETUP.md for the re-mint step.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # The script deploys hosting itself (and refuses to publish when that
        # deploy fails), so the workflow must NOT deploy again — the old second
        # step had no auth and red-exited every successful run.
        run: node generate-community-audio.js

      # always(): a Hosting deploy replaces the whole site with whatever is in
      # public/, and only committed files survive a fresh checkout. If the
      # generate step fails after writing assets, those files must still land in
      # the repo — otherwise the next deploy silently 404s a published story.
      - name: Persist generated files
        if: always()
        run: |
          git config user.name "storybyte-bot"
          git config user.email "bot@storybyte.app"
          # Only the last day's videos stay in the repo — nothing reads them
          # after posting, and each one otherwise rides along in every deploy.
          node scripts/prune-old-videos.js || true
          git add public/audio public/covers 2>/dev/null || true
          git commit -m "chore: community story audio + covers" || echo "nothing to commit"
          # The daily workflow pushes to main too; rebase so a stale branch
          # doesn't reject the push. A real push failure must stay loud — it
          # means generated audio never landed.
          git pull --rebase --autostash || true
          git push
