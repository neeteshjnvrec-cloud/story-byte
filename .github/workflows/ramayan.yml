name: Ramayan Episodes

# The Ramayan in ~55 episodes of ~15 minutes, in order, every Monday,
# Wednesday and Friday: public on YouTube at 10:00 IST (Facebook as soon as
# it's rendered), each in the series playlist. The episode plan is
# scripts/epics/ramayan.js; see scripts/epic-episode.js.
on:
  schedule:
    # Mon/Wed/Fri 08:37 IST (03:07 UTC): rendering takes 30-60 minutes, and
    # the video is scheduled for 10:00.
    - cron: '7 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode number (blank = the next one; a number remakes that episode)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish to YouTube and Facebook'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ramayan
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    # About 30-40 minutes end to end on a standard runner.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts uv
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-lohit-deva fonts-dejavu-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install pipeline dependencies
        working-directory: scripts
        run: npm install
      - name: Render and publish the next episode
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNTS: ${{ secrets.CLOUDFLARE_ACCOUNTS }}
          # Backup narration if Microsoft's free voice keeps refusing: Sarvam
          # when a key is set, else Google Cloud TTS with the project's
          # service account (scripts/lib/google-tts.js).
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Free backup voice when Microsoft's edge-tts refuses (scripts/lib/gemini-tts.js).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: post to a Telegram channel (CHANNEL-IDENTITY.md → Telegram).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || secrets.TELEGRAM_CHANNEL }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: ${{ vars.SARVAM_SPEAKER }}
          EPIC: ramayan
          EPIC_EPISODE: ${{ inputs.episode }}
          # Scheduled runs go public on YouTube at 10:00 IST; a manual run right away.
          PUBLISH_HOUR_IST: ${{ github.event_name == 'schedule' && '10' || '' }}
          # A scheduled run has no inputs — publish then too.
          EPISODE_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          DEVOTIONAL_STYLE: ${{ vars.DEVOTIONAL_STYLE }}
          WHATSAPP_CHANNEL_URL: ${{ vars.WHATSAPP_CHANNEL_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node epic-episode.js
      # The mp4 is over GitHub's file limit and YouTube/Facebook keep their
      # own copies; it's downloadable from the run page for a day.
      - name: Keep the rendered video for a day
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ramayan-episode
          path: public/episodes/ramayan/**/*.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Save the episode's text, captions and thumbnail
        if: always()
        run: |
          git config user.name "storybyte-ramayan"
          git config user.email "bot@storybyte.app"
          # A failed run leaves empty files (e.g. a 0-byte audio.mp3) — never commit those.
          find public/episodes -type f -size 0 -delete 2>/dev/null || true
          git add public/episodes/ramayan 2>/dev/null || true
          git commit -m "chore: Ramayan episode $(date -u +%F)" || echo "nothing to commit"
          for delay in 2 4 8 16; do
            git pull --rebase --autostash || true
            git push && exit 0
            sleep "$delay"
          done
          exit 1

      # Puts the new episode in the app's "Long stories" row right away: the
      # site deploy rebuilds long-videos.json from the episodes' story.json.
      # Runs after the push above pulled in main, so it never deploys an
      # older copy of the site.
      - name: Update the website and the app's video stories
        if: success() && (github.event_name == 'schedule' || inputs.publish)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "No FIREBASE_SERVICE_ACCOUNT; skipping"; exit 0; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.34.0 deploy --only hosting --project storybyte-76716 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
          # The new episode as an app story too (likes, comments, Community feed).
          node scripts/sync-video-stories.js
