name: Deity Portraits

# Generates candidate reference portraits from each deity's traditional
# iconography for review (scripts/deity-portraits.js). Approve one by adding
# it to assets/deities/<key>.jpg. Nothing is committed or posted.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Comma-separated keys (blank = all main deities; see assets/deities/README.md)'
        required: false
        type: string
      candidates:
        description: 'Candidates per deity and model (1-4)'
        required: false
        default: '2'
        type: string
      models:
        description: 'Models, comma-separated: 4b (~100 neurons a portrait), 9b (~1,400; sharper), gemini (Google, sharpest; GEMINI_API_KEY)'
        required: false
        default: '4b'
        type: string
      style:
        description: 'Art style for this run (blank = the DEVOTIONAL_STYLE variable, else realistic)'
        required: false
        default: ''
        type: choice
        options: ['', realistic, epic, cartoon3d, cartoon2d, stickman]

permissions:
  contents: read

jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pipeline deps
        working-directory: scripts
        run: npm install
      - name: Generate portraits
        working-directory: scripts
        env:
          PORTRAIT_KEYS: ${{ inputs.keys }}
          PORTRAIT_CANDIDATES: ${{ inputs.candidates }}
          PORTRAIT_MODELS: ${{ inputs.models }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNTS: ${{ secrets.CLOUDFLARE_ACCOUNTS }}
          # Each portrait gets the picture check's verdict (lib/image-check.js).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Art style for every picture: realistic (default), epic, cartoon3d, cartoon2d or stickman —
          # set as a repository variable (Settings → Secrets and variables → Actions → Variables).
          DEVOTIONAL_STYLE: ${{ inputs.style || vars.DEVOTIONAL_STYLE }}
        run: node deity-portraits.js
      - uses: actions/upload-artifact@v4
        with:
          name: deity-portraits-${{ github.run_id }}
          path: deity-candidates/
          retention-days: 7
