name: Deity Portraits

# Generates candidate reference portraits from each deity's traditional
# iconography for review (scripts/deity-portraits.js). Approve one by adding
# it to assets/deities/<key>.jpg. Nothing is committed or posted.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Comma-separated keys (blank = all main deities; see assets/deities/README.md)'
        required: false
        type: string
      candidates:
        description: 'Candidates per deity (1-4)'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pipeline deps
        working-directory: scripts
        run: npm install
      - name: Generate portraits
        working-directory: scripts
        env:
          PORTRAIT_KEYS: ${{ inputs.keys }}
          PORTRAIT_CANDIDATES: ${{ inputs.candidates }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Devotional art style: realistic (default), cartoon3d or cartoon2d —
          # set as a repository variable (Settings → Secrets and variables → Actions → Variables).
          DEVOTIONAL_STYLE: ${{ vars.DEVOTIONAL_STYLE }}
        run: node deity-portraits.js
      - uses: actions/upload-artifact@v4
        with:
          name: deity-portraits-${{ github.run_id }}
          path: deity-candidates/
          retention-days: 7
